<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Cone Crew — preview sprites placeholder</title>
  <style>
    body { margin: 0; background: #1b1e22; color: #e8e8e8; font: 13px system-ui, sans-serif; }
    h1 { font-size: 16px; padding: 12px 16px 0; }
    .grid { display: flex; flex-wrap: wrap; gap: 16px; padding: 16px; }
    .cell { background: #2a2e34; border-radius: 8px; padding: 8px; text-align: center; }
    .cell canvas { display: block; background: #20242a; border-radius: 4px; }
    .cell span { display: block; margin-top: 6px; opacity: .8; }
  </style>
</head>
<body>
  <h1>Cone Crew — aperçu des dessins PLACEHOLDER (src/assets/sprites.ts)</h1>
  <p style="padding:0 16px;opacity:.7">
    Chaque vignette translate le ctx au centre, puis appelle la fonction (qui dessine à l'origine).
  </p>
  <div class="grid" id="grid"></div>

  <!-- preview.html sert d'aperçu manuel : ouvrir avec `npm run dev` puis /src/assets/preview.html -->
  <script type="module">
    import {
      drawTile, drawMark, drawCone, drawWorker, drawVehicle,
    } from './sprites.ts';

    const W = 110, H = 110;

    // Crée une vignette : translate au centre, applique fn(ctx), légende.
    function cell(label, fn, opts = {}) {
      const wrap = document.createElement('div');
      wrap.className = 'cell';
      const cv = document.createElement('canvas');
      cv.width = W; cv.height = H;
      const ctx = cv.getContext('2d');
      ctx.save();
      ctx.translate(W / 2, opts.cy ?? H / 2);
      fn(ctx);
      ctx.restore();
      const span = document.createElement('span');
      span.textContent = label;
      wrap.append(cv, span);
      document.getElementById('grid').append(wrap);
    }

    // 1. drawTile
    cell("drawTile('road')", (c) => drawTile(c, 'road'));
    cell("drawTile('work')", (c) => drawTile(c, 'work'));

    // 2. drawMark — pulse pour le cas non satisfait
    cell('drawMark(false, 0.5)', (c) => drawMark(c, false, 0.5));
    cell('drawMark(true, 0)',    (c) => drawMark(c, true, 0));

    // 3. drawCone
    cell('drawCone(false)', (c) => drawCone(c, false), { cy: H * 0.7 });
    cell('drawCone(true)',  (c) => drawCone(c, true),  { cy: H * 0.6 });

    // 4. drawWorker — directions + pose
    for (const dir of ['N', 'E', 'S', 'W']) {
      cell(`drawWorker('${dir}')`, (c) => drawWorker(c, dir, 0, false), { cy: H * 0.7 });
    }
    cell("drawWorker('S', placing)", (c) => drawWorker(c, 'S', 0, true), { cy: H * 0.7 });

    // 5. drawVehicle — deux axes
    cell("drawVehicle('car','x')", (c) => drawVehicle(c, 'car', 'x'));
    cell("drawVehicle('car','y')", (c) => drawVehicle(c, 'car', 'y'));
  </script>
</body>
</html>
